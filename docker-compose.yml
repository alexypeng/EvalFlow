services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: evalflow
        ports:
            - "5432:5432"
        volumes:
            - evalflow_postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d evalflow"]
            interval: 2s
            timeout: 5s
            retries: 15

    postgres-test:
        image: postgres:16
        profiles: ["test"]
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: evalflow_test
        ports:
            - "5433:5432"
        tmpfs:
            - /var/lib/postgresql/data

    migrate:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
        depends_on:
            postgres:
                condition: service_healthy
        command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
        restart: "no"

    api:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
            GEMINI_API_KEY:
            LLM_PROVIDER: gemini
            PORT: 3000
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
        ports:
            - "3000:3000"
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["node", "--experimental-loader=@opentelemetry/instrumentation/hook.mjs", "dist/startApi.js"]

    prometheus:
        image: prom/prometheus:v3.15.0
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - evalflow_prometheus:/prometheus
        depends_on:
            - api

    tempo:
        image: grafana/tempo:3.1.0
        command: ["-target=all", "-config.file=/etc/tempo/tempo.yml"]
        ports:
            - "127.0.0.1:3200:3200"
            - "127.0.0.1:4318:4318"
        volumes:
            - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
            - evalflow_tempo:/var/tempo

    grafana:
        image: grafana/grafana:13.2.4
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_AUTH_DISABLE_LOGIN_FORM: "true"
            GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api.json
        ports:
            - "127.0.0.1:3001:3000"
        volumes:
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
            - evalflow_grafana:/var/lib/grafana
        depends_on:
            - prometheus
            - tempo

    worker:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
            GEMINI_API_KEY:
            GEMINI_MODEL: gemini-3.8-flash
            LLM_PROVIDER: gemini
            WORKER_CONCURRENCY: 1
            WORKER_WAKEUP_MODE: ${WORKER_WAKEUP_MODE:-poll}
            POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
            WORKER_METRICS_PORT: 9100
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
            RATE_LIMIT_MOCK: ${RATE_LIMIT_MOCK:-false}
            LEASE_DURATION_MS: ${LEASE_DURATION_MS:-60000}
            HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-20000}
            WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
            WORKER_SHUTDOWN_CLEANUP_MS: ${WORKER_SHUTDOWN_CLEANUP_MS:-5000}
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["node", "--experimental-loader=@opentelemetry/instrumentation/hook.mjs", "dist/startWorker.js"]
        expose:
            - "9100"
        stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-40s}

    reaper:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
            REAPER_INTERVAL_MS: ${REAPER_INTERVAL_MS:-5000}
            REAPER_BATCH_SIZE: ${REAPER_BATCH_SIZE:-100}
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["pnpm", "start:reaper"]

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        environment:
            VITE_API_URL: http://localhost:3000
        ports:
            - "5173:5173"
        depends_on:
            - api

volumes:
    evalflow_postgres:
    evalflow_prometheus:
    evalflow_grafana:
    evalflow_tempo:
