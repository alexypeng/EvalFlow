services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: evalflow
        ports:
            - "5432:5432"
        volumes:
            - evalflow_postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d evalflow"]
            interval: 2s
            timeout: 5s
            retries: 15

    postgres-test:
        image: postgres:16
        profiles: ["test"]
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: evalflow_test
        ports:
            - "5433:5432"
        tmpfs:
            - /var/lib/postgresql/data

    migrate:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
        depends_on:
            postgres:
                condition: service_healthy
        command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
        restart: "no"

    api:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
            GEMINI_API_KEY:
            LLM_PROVIDER: mock
            PORT: 3000
        ports:
            - "3000:3000"
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["pnpm", "start:api"]

    worker:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
            GEMINI_API_KEY:
            GEMINI_MODEL: gemini-3.8-flash
            LLM_PROVIDER: mock
            WORKER_CONCURRENCY: 1
            RATE_LIMIT_MOCK: ${RATE_LIMIT_MOCK:-false}
            LEASE_DURATION_MS: ${LEASE_DURATION_MS:-60000}
            HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-20000}
            WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
            WORKER_SHUTDOWN_CLEANUP_MS: ${WORKER_SHUTDOWN_CLEANUP_MS:-5000}
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["node", "dist/worker.js"]
        stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-40s}

    reaper:
        build:
            context: .
            dockerfile: server/Dockerfile
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evalflow
            REAPER_INTERVAL_MS: ${REAPER_INTERVAL_MS:-5000}
            REAPER_BATCH_SIZE: ${REAPER_BATCH_SIZE:-100}
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["pnpm", "start:reaper"]

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        environment:
            VITE_API_URL: http://localhost:3000
        ports:
            - "5173:5173"
        depends_on:
            - api

volumes:
    evalflow_postgres:
