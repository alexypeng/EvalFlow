apiVersion: v1
kind: Service
metadata:
    name: {{ include "evalflow.postgresName" . }}
    labels:
        {{- include "evalflow.postgresLabels" . | nindent 8 }}
spec:
    clusterIP: None
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
    selector:
        {{- include "evalflow.postgresSelectorLabels" . | nindent 8 }}
