apiVersion: v1
kind: Service
metadata:
    name: {{ .Release.Name }}-api
    labels:
        {{- include "evalflow-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
spec:
    type: ClusterIP
    ports:
        - name: http
          port: {{ .Values.api.port }}
          targetPort: http
    selector:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
