apiVersion: batch/v1
kind: Job
metadata:
    name: {{ .Release.Name }}-migrate
    labels:
        {{- include "evalflow-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "0"
        # Keep logs until the next attempt or TTL cleanup, including when migration fails.
        helm.sh/hook-delete-policy: before-hook-creation
spec:
    backoffLimit: 0
    activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
    ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
    template:
        metadata:
            labels:
                {{- include "evalflow-app.labels" . | nindent 16 }}
                app.kubernetes.io/component: migrate
        spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            terminationGracePeriodSeconds: 10
            containers:
                - name: migrate
                  image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  workingDir: /app/server
                  env:
                      {{- include "evalflow-app.databaseEnv" . | nindent 22 }}
                  command: [node, --input-type=commonjs, -e]
                  args:
                      - |
                          const { spawnSync } = require("node:child_process");
                          const url = new URL("postgresql://localhost");
                          url.hostname = process.env.PGHOST;
                          url.port = process.env.PGPORT;
                          url.username = encodeURIComponent(process.env.PGUSER);
                          url.password = encodeURIComponent(process.env.PGPASSWORD);
                          url.pathname = `/${encodeURIComponent(process.env.PGDATABASE)}`;
                          const child = spawnSync("pnpm", ["exec", "prisma", "migrate", "deploy"], {
                              stdio: "inherit",
                              env: { ...process.env, DATABASE_URL: url.toString() },
                          });
                          if (child.error) console.error("Could not launch Prisma migrations");
                          process.exit(child.status ?? 1);
                  resources:
                      {{- toYaml .Values.migrations.resources | nindent 22 }}
