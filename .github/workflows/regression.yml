name: Eval regression

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: eval-regression-${{ github.ref }}
    cancel-in-progress: true

jobs:
    evaluate:
        name: Dataset regression gate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: evalflow_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evalflow_test
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Run dataset gate
              run: bash scripts/ci-regression.sh
            - name: Publish check summary
              if: always()
              run: |
                  mkdir -p .evalflow-ci
                  if [ ! -s .evalflow-ci/summary.md ]; then
                    printf '## EvalFlow regression check\n\n**Result: ERROR**\n\nSetup failed before the gate ran. See workflow logs.\n' > .evalflow-ci/summary.md
                  fi
                  cat .evalflow-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
            - name: Upload regression report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: evalflow-regression-report
                  path: .evalflow-ci/
                  retention-days: 14
                  include-hidden-files: true
                  if-no-files-found: error

    comment:
        name: Update PR summary
        needs: evaluate
        if: >-
            always() && !cancelled() && github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 3
        permissions:
            actions: read
            pull-requests: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: evalflow-regression-report
                  path: report
            - uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('node:fs');
                      const marker = '<!-- evalflow-regression-summary -->';
                      const summary = fs.readFileSync('report/summary.md', 'utf8');
                      const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const body = `${marker}\n${summary.slice(0, 60000)}\n\n[Workflow run](${url})`;
                      const params = { ...context.repo, issue_number: context.issue.number };
                      const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
                      const existing = comments.find(comment =>
                        comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                      } else {
                        await github.rest.issues.createComment({ ...params, body });
                      }
